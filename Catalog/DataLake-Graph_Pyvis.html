            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

180}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_HealthEDR-ExclusionsIOA\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Total number of IOA exceptions\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct Exception ID.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eeach exception disables a behavioral detection for a specific process, creating a blind spot not in a directory, but in an attack technique; the total measures how many detections were deliberately suppressed and serves as a baseline for tracking growth between periods. This is the highest-consequence type of exclusion, because the suppressed pattern describes known attack behavior, and the justification is usually a legitimate false positive, which makes periodic review indispensable rather than optional.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Percentage of exceptions applied globally\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eratio of records with Applied Globally true over the total number of IOA exceptions.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ea global exception suppresses behavioral detection across the entire fleet at once, instead of being restricted to specific hosts; tracking this ratio shows how much of the suppression has broad reach, the type of configuration that most deserves periodic review.\u003c/span\u003e\u003c/pre\u003e", "env": "HML", "font": {"color": "#ffffff"}, "id": "GOLD_HealthEDR-ExclusionsIOA", "label": "GOLD_HealthEDR-ExclusionsIOA", "layer": "gold", "physics": false, "plat": null, "proj": "EDR Health Check Report", "row": 3, "shape": "dot", "size": 16, "x": 1170.0, "y": 270}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_HealthEDR-ExclusionsML\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Total number of Machine Learning exceptions\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct Exception ID.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eeach exception prevents the Machine Learning engine from evaluating a specific path as malware; the total measures how much of the ML-based detection is disabled by manual configuration and serves as a baseline for tracking growth between periods.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Percentage of exceptions applied globally\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eratio of records with Applied Globally true over the total number of Machine Learning exceptions.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ea global exception disables ML detection for the entire fleet at once, instead of being restricted to specific hosts; tracking this ratio shows how much of the suppression has broad reach, the type of configuration that most deserves periodic review.\u003c/span\u003e\u003c/pre\u003e", "env": "HML", "font": {"color": "#ffffff"}, "id": "GOLD_HealthEDR-ExclusionsML", "label": "GOLD_HealthEDR-ExclusionsML", "layer": "gold", "physics": false, "plat": null, "proj": "EDR Health Check Report", "row": 4, "shape": "dot", "size": 16, "x": 1170.0, "y": 360}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_HealthEDR-ExclusionsSVE\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Total number of Sensor Visibility exceptions\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct Exception ID.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eeach exception reduces the sensor\u0026#x27;s visibility over a specific path; the total measures how much of the monitored surface is out of view and serves as a baseline for tracking growth between periods, since a forgotten exception becomes a permanent blind spot.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Percentage of exceptions applied globally\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eratio of records with Applied Globally true over the total number of Sensor Visibility exceptions.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ea global exception reduces visibility across the entire fleet at once, instead of being restricted to specific hosts; tracking this ratio shows how much of the visibility suspension has broad reach, the type of configuration that most deserves periodic review.\u003c/span\u003e\u003c/pre\u003e", "env": "HML", "font": {"color": "#ffffff"}, "id": "GOLD_HealthEDR-ExclusionsSVE", "label": "GOLD_HealthEDR-ExclusionsSVE", "layer": "gold", "physics": false, "plat": null, "proj": "EDR Health Check Report", "row": 5, "shape": "dot", "size": 16, "x": 1170.0, "y": 450}, {"client": "CLIENT-A", "color": "#ab47bc", "detail": "\u003cb\u003eAUDIT_USBControl-StaleExceptions\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eUSB Control - Inactive Devices:\u003cbr\u003e\u003cbr\u003eDevices that have \u0026quot;Usage History (Days)\u0026quot; greater than or equal to 90 days and with the \u0026quot;Is Active\u0026quot; column marked as False.\u003cbr\u003e\u003cbr\u003eNote: they will be stored separately for later tracking and possible automatic removal of the exception.", "env": "HML", "font": {"color": "#ffffff"}, "id": "AUDIT_USBControl-StaleExceptions", "label": "AUDIT_USBControl-StaleExceptions", "layer": "audit", "physics": false, "plat": null, "proj": "USB Device Control", "row": 3, "shape": "dot", "size": 16, "x": 715.0000000000001, "y": 270}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_USBControl-UsageManagement\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Total number of registered USB exceptions\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct Exception Id.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eeach exception allows a specific USB device to bypass the default blocking policy, expanding the exposure surface to data exfiltration via removable media. The total serves as a baseline for tracking the growth in the volume of granted exceptions between periods, signaling whether the control is being relaxed over time.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Number of USB exceptions inactive for 90 days or more\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct Exception Id where Is Active is false and Usage History (Days) is greater than or equal to 90.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ean exception with no recorded usage for 90 days or more granted access that no one made use of, keeping an open risk with no corresponding operational benefit. The indicator measures the size of the queue of stalled exceptions, candidates for automatic revocation, and its growth points to exceptions being granted without periodic review.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e3. Distribution of USB exceptions by device class\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct Exception Id grouped by USB Device Class.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eeach device class represents a different exfiltration vector \u2014 mass storage is not the same risk as a printer or an audio device. The distribution shows where the policy\u0026#x27;s permissiveness is concentrated, guiding which class to prioritize in a hardening review.\u003c/span\u003e\u003c/pre\u003e", "env": "HML", "font": {"color": "#ffffff"}, "id": "GOLD_USBControl-UsageManagement", "label": "GOLD_USBControl-UsageManagement", "layer": "gold", "physics": false, "plat": null, "proj": "USB Device Control", "row": 6, "shape": "dot", "size": 16, "x": 1170.0, "y": 540}, {"client": "CLIENT-A", "color": "#ab47bc", "detail": "\u003cb\u003eAUDIT_GVulnerabilities-UnwatchedAssets\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eVulnerability Management - Assets without a Match (VCenter):\u003cbr\u003e\u003cbr\u003eAssets monitored by Tenable whose MAC address does not match any virtual machine in the VCenter inventory.\u003cbr\u003e\u003cbr\u003eNote: they will be stored separately for later tracking and possible automatic removal.", "env": "PRD", "font": {"color": "#ffffff"}, "id": "AUDIT_GVulnerabilities-UnwatchedAssets", "label": "AUDIT_GVulnerabilities-UnwatchedAssets", "layer": "audit", "physics": false, "plat": null, "proj": "Vulnerability Management", "row": 4, "shape": "dot", "size": 16, "x": 715.0000000000001, "y": 360}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_GVulnerabilities-Assets\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Number of monitored hosts\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct \u0026quot;Server Id\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eit is the denominator base for nearly all other indicators and the size metric of the fleet under management. Without it, averages and percentages have no reference.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Average number of active vulnerabilities per monitored host\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003esum of active vulnerabilities divided by the \u0026quot;Number of monitored hosts\u0026quot;. Average weighted by the number of hosts.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003erisk density per asset; it allows fair comparison of departments of different sizes.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e3. Top 10 hosts with the most active vulnerabilities\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ehosts with the highest sum of active vulnerabilities.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eidentifies the assets that concentrate the highest volume of exposure, natural targets for remediation campaigns.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e4. Top 10 hosts with the most active critical vulnerabilities\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ehosts with the highest value of active \u0026quot;Vulns Critical\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eseparates raw volume from severity; a host with few vulnerabilities but all critical is more urgent than one with many low vulnerabilities.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e5. Top 10 hosts with the highest ACR\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ehosts with the highest \u0026quot;Score ACR\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ethe ACR (1-10) measures the asset\u0026#x27;s criticality to the business; it lists the assets whose compromise would have the greatest impact, regardless of how many vulnerabilities they currently have.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e6. Top 10 hosts with the highest AES\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ehosts with the highest \u0026quot;Score AES\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ethe AES (0-1000) measures the asset\u0026#x27;s current exposure (criticality + risk of present vulnerabilities); it lists where the probability/severity of compromise is highest right now.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e7. Top 10 \u2014 Weighted risk index by host and department\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eindex = 10\u00d7Vulns Critical + 5\u00d7Vulns High + 2\u00d7Vulns Medium + 1\u00d7Vulns Low (active), by host and summed by department.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecounting vulnerabilities treats a critical the same as a low. The weighted index reorders the ranking by actual risk and works as the dashboard\u0026#x27;s single \u0026quot;main number\u0026quot;.\u003c/span\u003e\u003c/pre\u003e", "env": "PRD", "font": {"color": "#ffffff"}, "id": "GOLD_GVulnerabilities-Assets", "label": "GOLD_GVulnerabilities-Assets", "layer": "gold", "physics": false, "plat": null, "proj": "Vulnerability Management", "row": 7, "shape": "dot", "size": 16, "x": 1170.0, "y": 630}, {"client": "CLIENT-A", "color": "#66bb6a", "detail": "\u003cb\u003eAUTOMATA_Reassign-Asset-Tags-in-Tenable\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003etarget\u003c/u\u003e:\u003cbr\u003eTenable\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eSector Tag Reassignment \u2014 Tenable:\u003cbr\u003e\u003cbr\u003eCorrect in Tenable the sector tag of assets whose department, as determined in the VCenter inventory, differs from what is registered on the platform.\u003cbr\u003e\u003cbr\u003e\u003cu\u003efrequency\u003c/u\u003e:\u003cbr\u003eMonthly\u003cbr\u003e\u003cbr\u003e\u003cu\u003eexecution_schedule\u003c/u\u003e:\u003cbr\u003e10th of the month at 06:00 AM", "env": "HML", "font": {"color": "#ffffff"}, "id": "AUTOMATA_Reassign-Asset-Tags-in-Tenable", "label": "AUTOMATA_Reassign-Asset-Tags-in-Tenable", "layer": "automation", "physics": false, "plat": null, "proj": "Vulnerability Management", "row": 4, "shape": "dot", "size": 16, "x": 1494.9999999999998, "y": 360}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_GVulnerabilities-Vulns\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eReference SLAs: Critical = 80 days | High = 100 days | Medium = 120 days | Low = 140 days.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Number of active vulnerabilities by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of records grouped by \u0026quot;Vuln Severity\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ebasic snapshot of the risk backlog by severity; starting point for any prioritization.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Number of vulnerabilities with accepted risk by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of records grouped by \u0026quot;Vuln Severity\u0026quot;, showing only Risk State = ACCEPTED.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eprovides visibility into formally accepted risk (a conscious decision vs. silent accumulation) and allows auditing exceptions, especially at high severities.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e3. Average age of active vulnerabilities by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003e\u0026quot;Vuln Age-in-days\u0026quot; aggregated by \u0026quot;Vuln Severity\u0026quot;. Display average, median, and p90/p95. The average at the client/group level is weighted by the volume of vulnerabilities in each department.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003emeasures how long the risk has been open; high age at high severities is a direct sign of process failure.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e4. Active vulnerabilities in CISA KEV\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount and list of records with \u0026quot;On CISA KEV\u0026quot; = true.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ethe KEV catalog gathers vulnerabilities with confirmed active exploitation in the wild. It is the \u0026quot;fix now\u0026quot; indicator; it is usually a minimal fraction of the total and therefore highly actionable.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e5. Active vulnerabilities with an available exploit\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of records with \u0026quot;Exploit Available\u0026quot; = true, broken down by \u0026quot;Exploit Maturity\u0026quot;, \u0026quot;Exploited By Malware\u0026quot;, and \u0026quot;Exploited By Nessus\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ethe existence and maturity of an exploit, and use by malware, drastically raise the probability of a real attack, much more discriminating than raw CVSS severity and VPR alone.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e6. Active vulnerabilities by EPSS range\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of records by \u0026quot;EPSS Score\u0026quot; range (e.g., \u2265 0.5 / 0.1\u20130.5 / \u0026lt; 0.1).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eEPSS estimates the probability of exploitation in the next 30 days; cross-referenced with exploit availability, it filters out much of the noise from theoretical severity.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e7. Actionable backlog with combined prioritization\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount and list of vulnerabilities where \u0026quot;Vuln Severity\u0026quot; = {Critical, High} and (\u0026quot;On CISA KEV\u0026quot; = true or \u0026quot;Exploit Available\u0026quot; = true or \u0026quot;EPSS Score\u0026quot; high).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eisolates the subset that genuinely requires immediate action. It is small, real, and feasible to bring to zero, the best single number to hold a department accountable for.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e8. Percentage of active vulnerabilities within/outside SLA by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eclassify each active vulnerability as within/outside SLA by comparing \u0026quot;Vuln Age in-days\u0026quot; to the SLA of its severity; calculate the percentage in each state.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eit is the main governance and accountability indicator, it measures deadline discipline, not just volume.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e9. Active vulnerabilities that are overdue and exploitable\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003evulnerabilities outside SLA (8. Percentage of active vulnerabilities within/outside SLA by severity) and (\u0026quot;On CISA KEV\u0026quot; = true or \u0026quot;Exploit Available\u0026quot; = true).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ethe worst possible combination, proven real risk and a blown deadline; it should top any action list.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e10. Distinct vulnerabilities vs. instances\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of distinct vulnerabilities (by \u0026quot;Vuln Group\u0026quot; or distinct CVEs) vs. count of instances (records = vuln \u00d7 host).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003efixing a single vulnerability can resolve hundreds of instances; showing both numbers avoids overestimating the effort and guides prioritization by reach.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e11. Concentration by family / operating system\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of active vulnerabilities grouped by \u0026quot;Vuln Family\u0026quot; and by \u0026quot;Server System\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ereveals remediation patterns (e.g., many outdated Oracle Linux kernels) that enable single patch campaigns instead of item-by-item treatment.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e12. New vulnerabilities in the month\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of records whose \u0026quot;First Seen\u0026quot; falls within the reference month (\u0026quot;Reference Month\u0026quot; / \u0026quot;Reference Year\u0026quot;), by severity.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003emeasures the inflow of risk.\u003c/span\u003e\u003c/pre\u003e", "env": "PRD", "font": {"color": "#ffffff"}, "id": "GOLD_GVulnerabilities-Vulns", "label": "GOLD_GVulnerabilities-Vulns", "layer": "gold", "physics": false, "plat": null, "proj": "Vulnerability Management", "row": 8, "shape": "dot", "size": 16, "x": 1170.0, "y": 720}, {"client": "CLIENT-A", "color": "#ffd54f", "detail": "\u003cb\u003eGOLD_GVulnerabilities-VulnsFixed\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eThe Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.\u003cbr\u003e\u003cbr\u003eAll indicators must be generated per client, department group, and/or department.\u003cbr\u003e\u003cbr\u003eReference SLAs: Critical = 80 days | High = 100 days | Medium = 120 days | Low = 140 days.\u003cbr\u003e\u003cbr\u003eThe generated indicators are:\u003cbr\u003e\u003cbr\u003e\u003cu\u003ekpis\u003c/u\u003e:\u003cbr\u003e\u003cpre\u003e\u003cspan class=\"kt\"\u003e1. Number of vulnerabilities fixed by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecount of records grouped by \u0026quot;Vuln Severity\u0026quot; (in the reference month).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003erisk outflow volume, it measures the remediation effort/delivery for the period.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e2. Number of vulnerabilities fixed by severity (year-to-date)\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003ecumulative count for the current year, grouped by \u0026quot;Vuln Severity\u0026quot;.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eannual trend view of remediation delivery, useful for targets and YTD comparisons.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e3. Average remediation time (MTTR) by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eMTTR = \u0026quot;Last Fixed\u0026quot; - \u0026quot;First Seen\u0026quot;, aggregated by \u0026quot;Vuln Severity\u0026quot;. Display average, median, and p90/p95. Average at the client/group level weighted by the volume of each department; at the department level, the department\u0026#x27;s own arithmetic mean.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eMTTR is the central KPI for remediation effectiveness; broken down by severity it shows whether deadlines keep pace with severity.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e4. Average remediation time (MTTR) by severity (year-to-date)\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eMTTR = \u0026quot;Last Fixed\u0026quot; - \u0026quot;First Seen\u0026quot;, aggregated by \u0026quot;Vuln Severity\u0026quot;, cumulative for the current year.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eannual MTTR trend; it shows sustained improvement or degradation of the process.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e5. Percentage of vulnerabilities fixed within SLA by severity\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eof the fixed vulnerabilities, the percentage whose MTTR (\u0026quot;Last Fixed\u0026quot; - \u0026quot;First Seen\u0026quot;) \u2264 the SLA for the severity. Monthly and year-to-date views.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003emeasures deadline discipline in delivery and is the main accountability number for remediation.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e6. Net balance / burndown (inflows vs. outflows)\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eby month, new vulnerabilities (12. New vulnerabilities in the month) minus fixed vulnerabilities (1. Number of vulnerabilities fixed by severity); accumulate for the burndown curve.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eshows whether the department is winning or losing the race, more informative than fixed volume alone. Requires cross-referencing the active and fixed vulnerabilities datasets.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e7. Severity mix \u2014 fixed vs. open\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003epercentage distribution by \u0026quot;Vuln Severity\u0026quot; for the fixed ones, compared to the distribution of the active ones (active vulnerabilities).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ereveals whether the department closes many low-severity items while criticals age, or whether it prioritizes correctly.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e8. Reopening / recurrence rate\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003eratio of vulnerabilities that are recorded as fixed and reappear as active in a later month (same \u0026quot;Vuln Id\u0026quot; + \u0026quot;Server Id\u0026quot;).\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003ea quality signal that volume doesn\u0026#x27;t capture \u2014 a patch that didn\u0026#x27;t take, a rollback, or a regression. Requires cross-referencing fixed \u00d7 active vulnerabilities across monthly windows.\u003c/span\u003e\n\n\u003cspan class=\"kt\"\u003e9. Top fixed CVEs / families\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ecalculation\u003c/span\u003e: \u003cspan class=\"kv\"\u003e\u0026quot;Vuln Family\u0026quot; ordered by the number of instances fixed in the period.\u003c/span\u003e\n   \u003cspan class=\"kk\"\u003ereason\u003c/span\u003e: \u003cspan class=\"kv\"\u003eshows effective patch campaigns and the concrete impact of remediation actions.\u003c/span\u003e\u003c/pre\u003e", "env": "PRD", "font": {"color": "#ffffff"}, "id": "GOLD_GVulnerabilities-VulnsFixed", "label": "GOLD_GVulnerabilities-VulnsFixed", "layer": "gold", "physics": false, "plat": null, "proj": "Vulnerability Management", "row": 9, "shape": "dot", "size": 16, "x": 1170.0, "y": 810}, {"client": "CLIENT-A", "color": "#66bb6a", "detail": "\u003cb\u003eAUTOMATA_Delete-Unwatched-Assets-in-Crowdstrike\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cu\u003etarget\u003c/u\u003e:\u003cbr\u003eCrowdstrike\u003cbr\u003e\u003cbr\u003e\u003cu\u003edescription\u003c/u\u003e:\u003cbr\u003eRemoval of Unmatched Assets \u2014 Crowdstrike:\u003cbr\u003e\u003cbr\u003eRemove from Crowdstrike the assets that do not have a Mac Address match in the VCenter inventory and that have a Last Seen of more than 10 days.\u003cbr\u003e\u003cbr\u003e\u003cu\u003efrequency\u003c/u\u003e:\u003cbr\u003eMonthly\u003cbr\u003e\u003cbr\u003e\u003cu\u003eexecution_schedule\u003c/u\u003e:\u003cbr <script>
(function () {

  var modeTitle = document.getElementById('mode-title');
  var clientSelect = document.getElementById('client-select');
  var countsBox = document.getElementById('counts-box');
  var emptyState = document.getElementById('empty-state');
  var LAYER_LABELS = [["raw", "Raw"], ["silver", "Silver"], ["audit", "Audit"], ["gold", "Gold"], ["automation", "Automation"]];

    filterSidebar.style.display = 'none';

    modeTitle.textContent = 'Details';
  }

  function checked(cls) {
    return Array.from(document.querySelectorAll('.' + cls + ':checked')).map(function (el) { return el.value; });
  }

  // "forward" follows e.from->e.to (descendants); "backward" follows
  // e.to->e.from (ancestors) - never flips direction mid-walk.
  function walk(startIds, poolSet, direction) {
    var seen = new Set(startIds);
    var queue = startIds.slice();
    while (queue.length > 0) {
      var current = queue.pop();
      edges.get().forEach(function (e) {
        if (direction === 'forward' && e.from === current && poolSet.has(e.to) && !seen.has(e.to)) {
          seen.add(e.to); queue.push(e.to);
        }
        if (direction === 'backward' && e.to === current && poolSet.has(e.from) && !seen.has(e.from)) {
          seen.add(e.from); queue.push(e.from);
        }
      });
    }
    return seen;

  // client+status restrict the universe (pool); platform/project mark the
  // "base" and expand to the full connected chain (forward+backward kept
  // separate - see walk() - to avoid crossing through a shared node, e.g.
  // RAW_VCenter-Assets, into another project's chain).
  function computeVisible(client, envs, plats, projs) {
    var pool = nodes.getIds().filter(function (id) {
      var n = nodes.get(id);
      return n.client === client && (envs.length === 0 || envs.indexOf(n.env) !== -1);
    });
    if (plats.length === 0 && projs.length === 0) return new Set(pool);
    var poolSet = new Set(pool);
    var base = [];
    pool.forEach(function (id) {
      var n = nodes.get(id);
      if ((n.plat && plats.indexOf(n.plat) !== -1) || (n.proj && projs.indexOf(n.proj) !== -1)) base.push(id);
    });
    var visible = new Set(base);
    walk(base, poolSet, 'forward').forEach(function (id) { visible.add(id); });
    walk(base, poolSet, 'backward').forEach(function (id) { visible.add(id); });
    return visible;
  }

  // disable options with no node in "candidates" (filter cascade)
  function restrictOptions(cls, field, candidates) {
    var available = new Set();
    candidates.forEach(function (id) {
      var v = nodes.get(id)[field];
      if (v) available.add(v);
    });
    document.querySelectorAll('.' + cls).forEach(function (el) {
      var ok = available.has(el.value);
      el.disabled = !ok;
      el.closest('label').style.opacity = ok ? '1' : '0.35';
      if (!ok) el.checked = false;
    });
  }

  function updateCounts(visible) {
    var counts = {};
    visible.forEach(function (id) {
      var layer = nodes.get(id).layer;
      counts[layer] = (counts[layer] || 0) + 1;
    });
    countsBox.innerHTML = LAYER_LABELS.map(function (pair) {
      var n = String(counts[pair[0]] || 0).padStart(2, '0');
      var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;' +
        'background:' + LAYER_COLORS[pair[0]] + ';margin-right:6px;"></span>';
      return '<div>' + dot + '<b>' + n + '</b> ' + pair[1] + '</div>';
    }).join('');
  }

  // reflow Y for visible nodes only (removes gaps left by hidden nodes) -
  // groups by column and sorts by the original "row", not the current y
  // (which a previous pass may have already compacted).
  function compactLayout(visible) {
    var byCol = {};
    visible.forEach(function (id) {
      var n = nodes.get(id);
      (byCol[n.x] = byCol[n.x] || []).push(id);
    });
    var updates = [];
    Object.keys(byCol).forEach(function (x) {
      var ids = byCol[x];
      ids.sort(function (a, b) { return nodes.get(a).row - nodes.get(b).row; });
      ids.forEach(function (id, i) { updates.push({id: id, y: i * 90}); });
    });
    nodes.update(updates);
  }

  function applyFilter() {
    var client = clientSelect.value;
    var envs = checked('f-env');
    restrictOptions('f-plat', 'plat', computeVisible(client, envs, [], []));
    var plats = checked('f-plat');
    restrictOptions('f-proj', 'proj', computeVisible(client, envs, plats, []));
    var projs = checked('f-proj');

    var visible = computeVisible(client, envs, plats, projs);
    var ids = nodes.getIds();
    nodes.update(ids.map(function (id) { return {id: id, hidden: !visible.has(id)}; }));
    edges.update(edges.get().map(function (e) {
      return {id: e.id, hidden: !(visible.has(e.from) && visible.has(e.to))};
    }));
    compactLayout(visible);
    updateCounts(visible);
    emptyState.style.display = visible.size === 0 ? 'block' : 'none';
    if (visible.size > 0) {
      // fit() frames node POSITIONS and ignores label width, so the longest
      // ids in the last column get clipped - zoom out to leave the margin
      network.fit({nodes: Array.from(visible)});
      network.moveTo({scale: network.getScale() * 0.9,
                      animation: {duration: 300, easingFunction: 'easeInOutQuad'}});
    }
  }
  document.querySelectorAll('.f-plat, .f-proj, .f-env').forEach(function (el) {
    el.addEventListener('change', applyFilter);
  });
  clientSelect.addEventListener('change', applyFilter);
  applyFilter();

  // click on a node: highlight its connected edges and show the details;
  // click on empty space goes back to filters (showFilters() resets the edges)
  network.on('click', function (params) {
    if (params.nodes.length > 0) {
      var connected = network.getConnectedEdges(params.nodes[0]);
      edges.update(edges.getIds().map(function (id) {
        return {id: id, color: connected.indexOf(id) !== -1 ? '#ffffff' : '#555555'};
      }));
      showDetail(params.nodes[0]);
    } else {
      showFilters();
    }
  });
})();
</script>
