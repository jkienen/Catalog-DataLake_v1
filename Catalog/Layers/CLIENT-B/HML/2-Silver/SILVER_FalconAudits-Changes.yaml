id: SILVER_FalconAudits-Changes
layer: silver
project: Tenant Audit (CrowdStrike)
sources_raw:
- RAW_Crowdstrike-AuditEvents-WS
- RAW_Crowdstrike-AuditEvents-SRV
- RAW_Crowdstrike-Users-WS
- RAW_Crowdstrike-Users-SRV
sources_silver: []
generates_audits: NA
execution_schedule: 2nd of the month at 02:00 AM
filters: |-
  Keeps only the audit events in the AuditLogV3Event format of three types: API client changes (creation, update, deletion, and secret reset), grant and revocation of user roles, and sensor update policy changes.
  Of the sensor update policy changes, keeps only those that changed the uninstall protection; the others are discarded.
  Keeps only the events whose action date falls in the calendar month prior to the run, from 00:00 (UTC-3) on the 1st of the previous month to 00:00 (UTC-3) on the 1st of the current month.
pipeline: |-
  The Data Science team will be responsible for retrieving the raw data from the Raw layer and structuring it as shown in the next step.

  Tenant:

  Client B has two tenants in CrowdStrike, one for desktops and one for servers. The records of both are read from their respective Raws, processed by the same rules described below and merged into the same set. The Tenant column receives "Desktops" for the records coming from the desktop tenant's Raws and "Servers" for those coming from the server tenant's Raws.

  Event Date / Event Time:

  Date and time of the action, converted from the UTC time returned by the platform to America/Sao_Paulo (UTC-3), in the YYYY-MM-DD and HH:MM:SS formats.

  Change Type / Action:

  "API Client" with the actions Create, Update, Delete, and Reset Secret; "User Role" with Grant and Revoke; "Uninstall Protection" with Policy Update.

  Actor:

  Who made the change, as recorded in the event.

  Target:

  The target of the change: the API client name; for roles, the target user's e-mail, looked up in the tenant's user list when the event carries only the UUID (the UUID remains when it is not found); for policies, the policy name.

  Before:

  For roles, the roles the user had before; for uninstall protection, the previous state in readable text (Enabled, Maintenance Mode, Disabled); "-" for API clients and when the source does not report it.

  After:

  For API clients, the scopes at creation or the new scopes of the update (or the new name, when only the name changed); for roles, "Granted: <roles>" or "Revoked: <roles>"; for uninstall protection, the new state in readable text; "-" when the source does not report it.

  Result:

  "Success" or "Failed" according to the event result. For uninstall protection changes it receives "-": the policy service does not report the result, and the audit format records "false" for all policy changes, successful or not.

  Source IP / Country:

  Source IP and country of the change; "-" when empty.
structure_notes: |-
  The data sources will be organized into the columns Event Date, Event Time, Change Type, Action, Actor, Target, Before, After, Result, Source IP, Country, Tenant, Reference Month, Reference Year, Reference Date, ensuring consistency, asset traceability, and data readiness for the indicators layer.
storage_notes: |-
  Storage will be done in the Silver layer; the structured data will be kept ready for queries feeding the indicator calculations.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-B/Silver/FalconAudits/YYYY-MM-DD/Changes.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the data.
