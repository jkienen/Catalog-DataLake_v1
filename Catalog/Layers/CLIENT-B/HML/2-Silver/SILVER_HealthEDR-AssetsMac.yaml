id: SILVER_HealthEDR-AssetsMac
layer: silver
project: EDR Health Check Report
sources_raw:
- RAW_Crowdstrike-Assets-WS
- RAW_Crowdstrike-Assets-SRV
- RAW_Crowdstrike-AssessmentHealth-WS
- RAW_Crowdstrike-AssessmentHealth-SRV
- RAW_Crowdstrike-PreventionPolicies-WS
- RAW_Crowdstrike-PreventionPolicies-SRV
- RAW_Crowdstrike-USBPolicies-WS
- RAW_Crowdstrike-USBPolicies-SRV
- RAW_Crowdstrike-FirewallPolicies-WS
- RAW_Crowdstrike-FirewallPolicies-SRV
- RAW_Crowdstrike-SensorUpdatePolicies-WS
- RAW_Crowdstrike-SensorUpdatePolicies-SRV
- RAW_Crowdstrike-ContentUpdatePolicies-WS
- RAW_Crowdstrike-ContentUpdatePolicies-SRV
sources_silver: []
generates_audits: NA
execution_schedule: Sundays at 03:00 AM and on the 1st of the month at 03:00 AM
filters: |-
  Keeps only hosts with Host OS = Mac. Hosts with an operating system other than Linux, Mac and Windows are discarded at the source.
pipeline: |-
  The Data Science team will be responsible for retrieving the raw data from the Raw layer and structuring it as shown in the next step.

  Tenant:

  Client B has two tenants in CrowdStrike, one for desktops and one for servers. The records of both are read from their respective Raws, processed by the same rules described below and merged into the same set. The Tenant column receives "Desktops" for the records coming from the desktop tenant's Raws and "Servers" for those coming from the server tenant's Raws.

  Mac Address:

  Union of the host's physical and connection addresses, deduplicated, sorted, and with the "-" separator replaced by ":".

  Last Seen:

  Converted from the UTC time returned by the platform to America/Sao_Paulo (UTC-3) and reformatted to YYYY-MM-DD.

  Host State:

  Capitalization of the host's raw status.

  Uninstall Protection:

  Capitalization of the uninstall protection value defined in the Sensor Update policy assigned to the host; falls back to "-" when the policy does not define the field.

  RFM:

  True when the host's reduced functionality mode indicator is marked as "yes"; false otherwise.

  Prevention Policy / USB Device Policy / Firewall Policy / Sensor Update Policy / Content Policy:

  Each one resolved by cross-referencing the policy id assigned to the host, per policy type, against the respective list of named policies (Prevention, Device Control, Firewall, Sensor Update, Content Update); falls back to "-" when the id is not found in the corresponding list.

  Host Score / Item: <signal>:

  Cross-referenced from the host's security posture assessment (Zero Trust Assessment), matching by host id. Host Score receives the overall sensor configuration score. Only the sensor part of the assessment is used - the operating system score and signals, which the same Raw also provides, are left out. An "Item: <signal name>" column is created per evaluated signal, with value "Ok" when the signal meets the criterion and "Attention" when it does not.
structure_notes: |-
  The data sources will be organized into the columns Last Seen, Host Id, Host Name, Mac Address, Host Type, Host OS, OS Version, Kernel Version, Host State, RFM, Uninstall Protection, Prevention Policy, USB Device Policy, Firewall Policy, Sensor Update Policy, Content Policy, Host Score, Item: Cloud ML - Cloud Anti-malware - Detection for macOS, Item: Cloud ML - Cloud Anti-malware - Prevention for macOS, Item: Cloud ML - Adware & PUP - Detection for macOS, Item: Cloud ML - Adware & PUP - Prevention for macOS, Item: Sensor ML Anti-malware | Detection for macOS, Item: Sensor ML Anti-malware | Prevention for macOS, Item: Sensor ML Adware & PUP | Detection for macOS, Item: Sensor ML Adware & PUP | Prevention for macOS, Item: Quarantine, Item: Execution Blocking - Custom Blocking for macOS, Item: Execution Blocking - Intelligence-Sourced Threats for macOS, Item: Execution Blocking - Suspicious Processes for macOS, Item: Unauthorized Remote Access IOAs - XPCOM Shell, Item: Unauthorized Remote Access IOAs - Chopper Webshell, Item: Unauthorized Remote Access IOAs - Empyre Backdoor, Item: Credential Dumping IOAs - KcPassword Decoded, Item: Credential Dumping IOAs - Hash Collector, Item: Script-based Execution Monitoring for macOS, Item: CrowdStrike - Real Time Response for macOS, Tenant, Reference Month, Reference Year, Reference Date, ensuring consistency, asset traceability, and data readiness for the indicators layer.
storage_notes: |-
  Storage will be done in the Silver layer; the structured data will be kept ready for queries feeding the indicator calculations.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-B/Silver/HealthEDR/YYYY-MM-DD/AssetsMac.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the data.
