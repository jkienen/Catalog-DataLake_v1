id: RAW_Crowdstrike-Workflows-SRV
layer: raw
platform: Crowdstrike
endpoint: |-
  (Workflows)
  - GET /workflows/combined/definitions/v1
description: |-
  Obtains the tenant's workflow (Falcon Fusion) definitions, including name, description, trigger, actions, conditions, activation status, validation errors, version, and last modification date. The data comes from Client B's server tenant.
load_type: Full
frequency: Monthly
volume_per_frequency: 132Kb
execution_schedule: 1st of the month at 05:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: a workflow's actions and conditions form a map with one entry per step; the sample keeps one of each and shortens the ticket's HTML body.

  Note: Client B has two tenants in CrowdStrike, one for desktops and one for servers, each with its own credential. This extraction uses the server tenant's credential; the same query is run on the other tenant in RAW_Crowdstrike-Workflows-WS.
filters: |-
  Run the query with the following conditions:

  - limit: 100
  - offset: pagination offset (0, 100, 200...)
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-B/Raw/CROWDSTRIKE/YYYY-MM-DD/Workflows-SRV.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
