id: RAW_Crowdstrike-AuditEvents-WS
layer: raw
platform: Crowdstrike
endpoint: |-
  (Audit Events)
  - GET /sensors/entities/datafeed/v2
  - GET <dataFeedURL> (stream URL returned by the first call)
description: |-
  Obtains the tenant's Event Stream events, including the console and API audit log (logins, two-factor verification, SSO, tenant switch, API client changes, role grants and revocations, policy changes, and revealed uninstall tokens), in addition to the other events published in the stream. The data comes from Client B's desktop (workstation) tenant.
load_type: Incremental
frequency: Monthly
volume_per_frequency: 321Mb
execution_schedule: 2nd of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the extraction happens in two steps: the first call returns the stream URL and a session token, and the second reads the stream from the oldest event it keeps (offset 0). Reading stops when it reaches events created one day after the end of the previous calendar month. The stream keeps about 34 days, so the extraction needs to run in the first days of the month to cover the entire previous month. Accented characters in the texts arrive corrupted from the source itself (for example, an accented letter arrives as �). The stream also publishes events that are not audit events (detections, Identity Protection, RTR sessions); the sample contains one record of each audit format used (AuditLogV3Event for login, API client, roles, and policy, and UserActivityAuditEvent for uninstall token).

  Note: Client B has two tenants in CrowdStrike, one for desktops and one for servers, each with its own credential. This extraction uses the desktop tenant's credential; the same query is run on the other tenant in RAW_Crowdstrike-AuditEvents-SRV.
filters: |-
  Run the query with the following conditions:

  - app_id: FalconAudits
  - format: json
  - offset: 0
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-B/Raw/CROWDSTRIKE/YYYY-MM-DD/AuditEvents-WS.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
