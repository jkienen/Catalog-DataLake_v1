pipeline: |-
  The Data Science team will be responsible for retrieving the raw data from the Raw layer and structuring it as shown in the next step.

  Severity, ExPRT Rating and Vuln State:

  API enumerated values converted into readable text: the words are separated by spaces and written with an initial capital letter, keeping the acronyms KB and CPE in uppercase (for example, VERSION_BASED becomes Version Based).

  Vuln Family, Vuln Vendor, Vuln Source and Adversaries:

  Distinct values of the source list - CVE types, vendors of the affected applications, data providers and associated adversaries -, joined by "; ". When the list is empty, the column receives "-".

  Vuln Resume:

  CVE description with the line breaks and repeated spaces replaced by a single space.

  Vuln Product:

  Product and version of each affected application, with the distinct values joined by "; ". Within the file, values that differ only in letter case are unified into the spelling with the most uppercase letters.

  First Seen:

  Date of the vulnerability's first detection, converted from UTC to local time (UTC-3) in the YYYY-MM-DD format.

  Last Expired:

  Date of the record's last update, taken as the expiration date, converted from UTC to local time (UTC-3) in the YYYY-MM-DD format.

  Host Last Seen:

  Last time the host was seen, converted from UTC to local time (UTC-3) in the YYYY-MM-DD format.

  CVE Published and CISA Due Date:

  CVE publication day and CISA KEV remediation due date, in the YYYY-MM-DD format, without time zone conversion. When they do not exist, they receive "-".

  Remediation Level:

  CVSS remediation level translated: O becomes Official Fix, T becomes Temporary Fix, W becomes Workaround and U becomes Unavailable. Other values receive "-".

  Exploit Available and Exploit Maturity:

  Derived from the Spotlight exploitation status. Exploit Maturity translates 0 into Unproven, 30 into Available, 60 into Easily Accessible and 90 into Actively Used (other values receive "-"); Exploit Available is true when the status is 30 or higher.

  On CISA KEV:

  Indicates whether the CVE is on the CISA KEV list; false when the information does not exist.

  Reference Month, Reference Year and Reference Date:

  Month, year and date of the routine's execution.

  Other columns:

  Copied from the source record; when the field does not exist, they receive "-".
structure_notes: |-
  The data sources will be organized into the columns Severity, Host Id, Host Name, Host Ip, Host Type, Host Platform, Host System, Internet Exposure, Vuln Group, Vuln Id, Vuln Name, Vuln Family, Vuln Resume, Vuln Product, Vuln Vendor, Vuln CVEs, Vuln Source, Vuln State, First Seen, Last Expired, Host Last Seen, CVE Published, CVSS Score, ExPRT Rating, Remediation Level, Exploit Available, Exploit Maturity, Exploitability Score, Adversaries, On CISA KEV, CISA Due Date, Reference Month, Reference Year, Reference Date, ensuring consistency, asset traceability, and data readiness for the indicators layer.
storage_notes: |-
  Storage will be done in the Silver layer; the structured data will be kept ready for queries feeding the indicator calculations.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Silver/GVulnerabilities/YYYY-MM-DD/VulnsExpired.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the data.
