id: SILVER_FalconAudits-Users
layer: silver
project: Tenant Audit (CrowdStrike)
sources_raw:
- RAW_Crowdstrike-Users
- RAW_Crowdstrike-UserRoles
sources_silver: []
generates_audits: NA
execution_schedule: 1st of the month at 03:30 AM
filters: NA
pipeline: |-
  The Data Science team will be responsible for retrieving the raw data from the Raw layer and structuring it as shown in the next step.

  Rows:

  One row per tenant user, with the roles granted to them.

  User Name:

  The user's first and last name joined by a space; "-" when both are empty.

  Status:

  Capitalized user status.

  Created / Last Login:

  Creation and last login dates, converted from the UTC time returned by the platform to America/Sao_Paulo (UTC-3) and formatted as YYYY-MM-DD. Last Login receives "-" when the user has never logged in.

  Days Since Last Login:

  Days between the last login date and the run date; "-" when the user has never logged in.

  Roles / Roles Total:

  Distinct names of the roles granted to the user, sorted and joined by "; ", and the number of distinct roles. Both receive "-" when the user's role query fails.

  Grant Type:

  Distinct grant types of the user's roles in readable text (Direct, Default CID Group), sorted and joined by "; ".

  Falcon Administrator:

  True when Falcon Administrator is among the user's roles.

  Item: Activity:

  "Ok" when the last login happened within the 45 days before the run; "Attention" when that period has passed or when the user has never logged in.
structure_notes: |-
  The data sources will be organized into the columns User Name, User Email, User UUID, Status, Created, Last Login, Days Since Last Login, Roles, Roles Total, Grant Type, Falcon Administrator, Item: Activity, Reference Month, Reference Year, Reference Date, ensuring consistency, asset traceability, and data readiness for the indicators layer.
storage_notes: |-
  Storage will be done in the Silver layer; the structured data will be kept ready for queries feeding the indicator calculations.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Silver/FalconAudits/YYYY-MM-DD/Users.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the data.
