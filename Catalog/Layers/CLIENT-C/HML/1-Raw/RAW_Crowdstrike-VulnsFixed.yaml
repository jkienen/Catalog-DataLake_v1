id: RAW_Crowdstrike-VulnsFixed
layer: raw
platform: Crowdstrike
endpoint: |-
  (Vulnerabilities Fixed)
  - GET /spotlight/combined/vulnerabilities/v1
description: |-
  Obtains the vulnerabilities fixed in the previous calendar month in Spotlight, one record per host × vulnerability pair, with the same structure as the active vulnerabilities - host identification and context, affected applications and CVE data - plus the fix date (closed_timestamp).
load_type: Incremental
frequency: Monthly
volume_per_frequency: 1.2Gb
execution_schedule: 1st of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the extraction is paginated by the after token, in pages of up to 5000 records. The window bounds are 00:00 (UTC-3) on the 1st day of the previous calendar month and of the current month, converted to UTC and computed at runtime. The same endpoint serves RAW_Crowdstrike-Vulns and RAW_Crowdstrike-VulnsExpired, with different filters. Incremental load: each run brings only the previous calendar month, and the deduplication key is id + closed_timestamp, since a vulnerability may be closed, reopened and closed again in another month.
filters: |-
  Run the query with the following conditions:

  - filter: "status:'closed'+closed_timestamp:>='<start of the previous month>'+closed_timestamp:<'<start of the current month>'"
  - facet: ["cve", "host_info", "remediation"]
  - limit: 5000
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Raw/CROWDSTRIKE/YYYY-MM-DD/VulnsFixed.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
