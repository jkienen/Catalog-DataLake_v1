id: RAW_Crowdstrike-IDPPolicyRules
layer: raw
platform: Crowdstrike
endpoint: |-
  (Identity Protection Policy Rules)
  - GET /identity-protection/queries/policy-rules/v1
  - GET /identity-protection/entities/policy-rules/v1
description: |-
  Obtains the Identity Protection policy rules (conditional access), including name, enablement and simulation state, the applied action (block, MFA and others) with its settings, the source, destination and activity conditions with the included and excluded options of each one, and the indicator and email notifications.
load_type: Full
frequency: Weekly
volume_per_frequency: 38Kb
execution_schedule: Sundays at 01:00 AM and on the 1st of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the extraction happens in two calls - the first returns, all at once, the ids of all registered rules, the second queries the full detail of each rule from those ids, in batches of up to 100.
filters: |-
  Run the query with the following conditions:

  - ids: list of rule ids returned by the first call, in batches of up to 100
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Raw/CROWDSTRIKE/YYYY-MM-DD/IDPPolicyRules.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
