id: RAW_Crowdstrike-IDPUsers
layer: raw
platform: Crowdstrike
endpoint: |-
  (Identity Protection Users - GraphQL)
  - POST /identity-protection/combined/graphql/v1
description: |-
  Obtains the Identity Protection user accounts, joining the Active Directory account and the Entra ID account, including identification and email, department, job title and OU, roles and privileges, account state and password attributes, groups it belongs to, associated machines, last activity, risk score and risk factors.
load_type: Full
frequency: Weekly
volume_per_frequency: "?"
execution_schedule: Sundays at 01:00 AM and on the 1st of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the query is made via GraphQL and paginated by cursor - each page returns up to 1000 entities, and the cursor of the last entity (endCursor) is sent in the next call while there is a next page (hasNextPage).
filters: |-
  Run the query with the following conditions:

  - query:
  "query ($after: Cursor) {
    entities(types: [USER], archived: false, first: 1000, after: $after) {
      nodes {
        entityId primaryDisplayName riskScore riskScoreSeverity watched riskFactors { type score }
        roles { type }
        privileged: hasRole(type: AdminAccountRole)
        ... on UserEntity { emailAddresses mostRecentActivity }
        associations { bindingType ... on OriginAssociation { entity { primaryDisplayName ... on EndpointEntity { hostName } } } }
        accounts {
          __typename
          ... on ActiveDirectoryAccountDescriptor { domain ou department title enabled lockoutTime expirationTime samAccountName upn passwordAttributes { lastChange mayExpire } containingGroupIds flattenedContainingGroupIds }
          ... on AzureSsoUserAccountDescriptor { department title enabled dataSourceLoginIdentifier }
        }
      }
      pageInfo { hasNextPage endCursor }
    }
  }"
  - variables: {"after": endCursor of the previous page, null on the first call}
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Raw/CROWDSTRIKE/YYYY-MM-DD/IDPUsers.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
