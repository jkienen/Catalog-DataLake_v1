id: RAW_Crowdstrike-InstalledPatches
layer: raw
platform: Crowdstrike
endpoint: |-
  (Installed Patches)
  - GET /spotlight/combined/installed-patches/v1
description: |-
  Obtains the patch summary of each Windows host in Spotlight, including the count of active and pending patches, the date of the last confirmed patch, the pending reboot indication and the list of installed patches with status, type, publication date and description.
load_type: Full
frequency: Weekly
volume_per_frequency: 1Mb
execution_schedule: Sundays at 02:00 AM and on the 1st of the month at 02:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the extraction happens in one call per host - the id of each Windows host from the Assets dataset is sent in the filter, and each response brings the patch summary of that host.
filters: |-
  Run the query with the following conditions:

  - filter: "aid:'<Host Id>'"
  - limit: 100
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Raw/CROWDSTRIKE/YYYY-MM-DD/InstalledPatches.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
sample_output: |-
  {
    "aid": "e5f6a7b8c9d0e1f2a3b4c5d6e7f8091a",
    "hostname": "WS004321",
    "reboot_required": false,
    "device_type": "Workstation",
    "active_patches": 61,
    "pending_patches": 0,
    "last_patch_confirmed": "2026-09-28T14:56:33Z",
