id: RAW_Crowdstrike-VulnsExpired
layer: raw
platform: Crowdstrike
endpoint: |-
  (Vulnerabilities Expired)
  - GET /spotlight/combined/vulnerabilities/v1
description: |-
  Obtains the vulnerabilities expired in the previous calendar month in Spotlight - closed because the host stopped reporting or was reinstalled -, one record per host × vulnerability pair, with the same structure as the active vulnerabilities, plus the last time the host was seen (host_last_seen_timestamp).
load_type: Incremental
frequency: Monthly
volume_per_frequency: 12Mb
execution_schedule: 1st of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the extraction is paginated by the after token, in pages of up to 5000 records. The window bounds are 00:00 (UTC-3) on the 1st day of the previous calendar month and of the current month, converted to UTC and computed at runtime. The same endpoint serves RAW_Crowdstrike-Vulns and RAW_Crowdstrike-VulnsFixed, with different filters. Incremental load: each run brings only the previous calendar month, and the deduplication key is the id, keeping the most recent record, since the updated_timestamp may change after the expiration and the same record may reappear in another month.
filters: |-
  Run the query with the following conditions:

  - filter: "status:'expired'+updated_timestamp:>='<start of the previous month>'+updated_timestamp:<'<start of the current month>'"
  - facet: ["cve", "host_info", "remediation"]
  - limit: 5000
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-C/Raw/CROWDSTRIKE/YYYY-MM-DD/VulnsExpired.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
