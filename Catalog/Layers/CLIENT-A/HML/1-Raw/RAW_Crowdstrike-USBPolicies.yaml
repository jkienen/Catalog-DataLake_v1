id: RAW_Crowdstrike-USBPolicies
layer: raw
platform: Crowdstrike
endpoint: |-
  (USB Device Control Policies)
  - GET /policy/query/device-control/v1
  - GET /policy/entities/device-control/v2
description: |-
  Obtains the Device Control (USB) policies from the Crowdstrike platform, including the configured device classes, the enforcement mode, and the exclusions registered by vendor id, product id, serial, or combined id.
load_type: Full
frequency: Weekly
volume_per_frequency: "?"
execution_schedule: Sundays at 01:00 AM and on the 1st of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the extraction happens in two calls - the first returns only the ids of the registered policies, the second queries the full detail of each policy from those ids.
filters: NA
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client/Raw/CROWDSTRIKE/YYYY-MM-DD/USBPolicies.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
