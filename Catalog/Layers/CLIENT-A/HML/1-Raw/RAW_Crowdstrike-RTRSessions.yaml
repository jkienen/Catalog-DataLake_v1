id: RAW_Crowdstrike-RTRSessions
layer: raw
platform: Crowdstrike
endpoint: |-
  (RTR Sessions)
  - GET /real-time-response-audit/combined/sessions/v1
description: |-
  Obtains the Real Time Response sessions opened in the tenant, including user (or API client), host, session origin, times, duration, and the commands executed in each one.
load_type: Full
frequency: Monthly
volume_per_frequency: 29Mb
execution_schedule: 1st of the month at 05:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the query is run one day at a time, because over the whole-month window the API cursor fails to return about 1% of the sessions; per day, the number read matches the total reported by the API. Pagination follows the cursor returned in pagination.next. In sessions opened by automation, user_id carries the API client identifier (api-client-<id>) instead of an e-mail.
filters: |-
  Run the query with the following conditions, for each day of the previous calendar month:

  - filter: "created_at:>='<day, 00:00 (UTC-3)>'+created_at:<'<next day, 00:00 (UTC-3)>'"
  - limit: 1000
  - with_command_info: true
  - offset: cursor returned in pagination.next
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-A/Raw/CROWDSTRIKE/YYYY-MM-DD/RTRSessions.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
