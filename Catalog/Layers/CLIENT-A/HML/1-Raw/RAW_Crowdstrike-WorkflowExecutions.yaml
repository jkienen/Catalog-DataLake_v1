id: RAW_Crowdstrike-WorkflowExecutions
layer: raw
platform: Crowdstrike
endpoint: |-
  (Workflow Executions)
  - GET /workflows/combined/executions/v1
description: |-
  Obtains the executions of the tenant's workflows, including status, start and end times, executed activities with their results, and the event that triggered each execution.
load_type: Full
frequency: Monthly
volume_per_frequency: 394Kb
execution_schedule: 1st of the month at 04:30 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: three calls per workflow: the total number of executions started in the previous calendar month, the total of those that finished successfully (status Succeeded), and the most recent execution. Of the first two, only the pagination total matters. The result of each activity and the trigger event were reduced in the sample to a few representative fields.
filters: |-
  Run the query with the following conditions, for each workflow:

  - filter: "definition_id:'<workflow id>'+started_timestamp:>='<1st day of the previous month, 00:00 (UTC-3)>'+started_timestamp:<'<1st day of the current month, 00:00 (UTC-3)>'"
  - filter: "definition_id:'<workflow id>'+started_timestamp:>='<1st day of the previous month, 00:00 (UTC-3)>'+started_timestamp:<'<1st day of the current month, 00:00 (UTC-3)>'+status:'Succeeded'"
  - filter: "definition_id:'<workflow id>'"
  - sort: started_timestamp.desc
  - limit: 1
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-A/Raw/CROWDSTRIKE/YYYY-MM-DD/WorkflowExecutions.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
