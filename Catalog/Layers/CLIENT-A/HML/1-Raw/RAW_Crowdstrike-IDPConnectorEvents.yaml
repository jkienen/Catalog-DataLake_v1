id: RAW_Crowdstrike-IDPConnectorEvents
layer: raw
platform: Crowdstrike
endpoint: |-
  (Identity Protection Connector Events - GraphQL Timeline)
  - POST /identity-protection/combined/graphql/v1
description: |-
  Obtains the history of Identity Protection connector events (IDaaS and MFA) recorded in the timeline, including configuration additions, changes and removals with the responsible user, and connector failures with status, error message and resolution state.
load_type: Full
frequency: Weekly
volume_per_frequency: "?"
execution_schedule: Sundays at 01:00 AM and on the 1st of the month at 01:00 AM
extraction_notes: |-
  The Data Science team will be responsible for running the routine that queries the described endpoint, applying the necessary filters, and storing the data in the Raw layer of the Data Lake.

  Note: the API does not list the connectors directly, only the configuration and failure events - that is why the query reads the entire timeline since 2020-01-01, via GraphQL, paginated by cursor in batches of 1000 events, from oldest to newest. The same dataset carries two record formats: configuration events (addition, change and removal) and failure events.
filters: |-
  Run the query with the following conditions:

  - query:
  "query ($start: DateTimeInput, $after: Cursor) {
    timeline(types: [CONNECTOR_CONFIGURATION_ADDED, CONNECTOR_CONFIGURATION_MODIFIED, CONNECTOR_CONFIGURATION_DELETED, CONNECTOR_FAILURE],
             startTime: $start, first: 1000, after: $after, sortOrder: ASCENDING) {
      nodes {
        eventType timestamp
        ... on TimelineConnectorConfigurationEvent { type category systemUser { displayName } }
        ... on TimelineConnectorFailureEvent { connectorType connectorStatus errorDetails { message } state { resolved dismissed lastUpdateTime } }
      }
      pageInfo { hasNextPage endCursor }
    }
  }"
  - variables: {"start": "2020-01-01T00:00:00Z", "after": endCursor of the previous page, null on the first call}
storage_notes: |-
  Storage will be done in the Raw layer, containing the data extracted directly from the described API endpoint, without any type of transformation, fully preserving the data.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-A/Raw/CROWDSTRIKE/YYYY-MM-DD/IDPConnectorEvents.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the protected server inventory data.
