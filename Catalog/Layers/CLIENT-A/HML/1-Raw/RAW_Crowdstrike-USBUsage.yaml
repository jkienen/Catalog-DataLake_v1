  {
    "Device": "Apple Inc. iPhone (S/N: 1a2b3c4d5e6f7a8b9c0d1e2f)",
    "DeviceClass": "Vendor Specific Class | Use class information in the Interface Descriptors | Mobile (MTP/PTP) | Imaging | Human Interface Device | Audio",
