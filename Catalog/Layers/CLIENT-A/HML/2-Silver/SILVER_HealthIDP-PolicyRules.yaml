id: SILVER_HealthIDP-PolicyRules
layer: silver
project: IDP Health Check Report
sources_raw:
- RAW_Crowdstrike-IDPPolicyRules
- RAW_Crowdstrike-IDPPolicyRuleMatches
sources_silver: []
generates_audits: NA
execution_schedule: Sundays at 02:00 AM and on the 1st of the month at 02:00 AM
filters: NA
pipeline: |-
  The Data Science team will be responsible for retrieving the raw data from the Raw layer and structuring it as shown in the next step.

  Action:

  Action applied by the rule, converted into a readable label (BLOCK becomes Block), with acronyms such as MFA kept in uppercase. Falls back to "-" when the rule does not report the action.

  Access Type / Protocol / Baseline / Source User Type / Source User Attributes / Source User Privileges / Source Users / Source User Groups / Source Endpoint Attributes / Source Endpoints / Source Endpoint Groups / Destination Roles / Destinations / Destination Groups:

  Each rule condition becomes a column, according to the condition's block and field (activity, source user, source endpoint and destination). The column lists the included options first, in alphabetical order, and then the excluded ones, with the "Not " prefix, joined by commas. Enumerated values are converted into a readable label, with acronyms such as SMB and MFA kept in uppercase and the "Role" suffix removed (AdminAccountRole becomes Admin Account, ServerRole becomes Server). Users, groups and endpoints, which the rule stores as entity ids, are displayed by name, obtained through a query to the Identity Protection GraphQL API: the host name for endpoints and the display name for the others; an entity that the query does not return keeps its own id. Receives "-" when the rule does not use that condition. A condition that is not in this list gets its own column, named after the block and the field, after the known columns. The option combination modes (ANY / ALL) and the grace periods of the actions remain only in the Raw layer.

  MFA Connector / MFA Factors:

  MFA connectors and factors configured in the rule, as readable labels joined by commas, filled in only when the rule's action is MFA; "-" otherwise.

  Indicator Severity:

  Severity of the indicator generated by the rule, as a readable label, filled in only when indicator notification is enabled; "-" otherwise.

  Matches / Matches (30d) / Last Match:

  Cross-referenced from the rule match history recorded in the Identity Protection timeline, matching by the rule id. Matches is the number of matches since 2020-01-01, including those that occurred in simulation mode. Matches (30d) is the number of matches in the last 30 days, counted from the run. Last Match is the date of the most recent match, converted from the UTC time returned by the platform to America/Sao_Paulo (UTC-3) and formatted as YYYY-MM-DD; falls back to "-" when the rule has never been matched. Matches of rules that no longer exist are not included in any row. When the history query fails, Matches and Matches (30d) also fall back to "-".

  Item: Enforced:

  "Ok" when the rule is enabled (Enabled = true) and out of simulation mode (Simulation Mode = false), that is, when it actually acts on access; "Attention" in any other case.

  Reference Month / Reference Year / Reference Date:

  Month (MM), year (YYYY) and date (YYYY-MM-DD) of the run, added as the last columns.
structure_notes: |-
  The data sources will be organized into the columns Rule Id, Rule Name, Enabled, Simulation Mode, Action, Access Type, Protocol, Baseline, Source User Type, Source User Attributes, Source User Privileges, Source Users, Source User Groups, Source Endpoint Attributes, Source Endpoints, Source Endpoint Groups, Destination Roles, Destinations, Destination Groups, MFA Connector, MFA Factors, Indicator Notification, Indicator Severity, Email Notification, Matches, Matches (30d), Last Match, Item: Enforced, Reference Month, Reference Year, Reference Date, ensuring consistency, asset traceability, and data readiness for the indicators layer.
storage_notes: |-
  Storage will be done in the Silver layer; the structured data will be kept ready for queries feeding the indicator calculations.

  The data is organized following the standard naming convention. Additionally, temporal segregation must be maintained by collection period, using the YYYY-MM-DD naming convention, according to the frequency defined by the business. The following pattern must be followed:

  CYBER/Client-A/Silver/HealthIDP/YYYY-MM-DD/PolicyRules.json

  This organization ensures temporal traceability, ingestion standardization, and ease of auditing the data.
