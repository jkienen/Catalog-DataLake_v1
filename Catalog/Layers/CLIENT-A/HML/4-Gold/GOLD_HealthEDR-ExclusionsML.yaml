id: GOLD_HealthEDR-ExclusionsML
layer: gold
project: EDR Health Check Report
sources_silver:
- SILVER_HealthEDR-ExclusionsML
description: |-
  The Gold layer consolidates the data from the Silver layer into indicators ready for analytical and executive consumption.

  All indicators must be generated per client, department group, and/or department.

  The generated indicators are:
kpis:
- title: Total number of Machine Learning exceptions
  calculation: count of distinct Exception ID.
  filters: null
  reason: each exception prevents the Machine Learning engine from evaluating a specific path as malware; the total measures how much of the ML-based detection is disabled by manual configuration and serves as a baseline for tracking growth between periods.
  view: numeric count by reference month, detailed in a list with Exception Value, Excluded From, Applied For.

- title: Percentage of exceptions applied globally
  calculation: ratio of records with Applied Globally true over the total number of Machine Learning exceptions.
  filters: null
  reason: a global exception disables ML detection for the entire fleet at once, instead of being restricted to specific hosts; tracking this ratio shows how much of the suppression has broad reach, the type of configuration that most deserves periodic review.
  view: percentage by reference month, detailed in a list with Exception Value, Excluded From, Created By.
last_reviewed: '2026-08-10'
